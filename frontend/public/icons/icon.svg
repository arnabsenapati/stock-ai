<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="110" fill="#0d1117" stroke="#2563eb" stroke-width="10"/>
  
  <!-- Candlestick 1: Green -->
  <line x1="140" y1="230" x2="140" y2="380" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  <rect x="120" y="270" width="40" height="80" rx="8" fill="#10b981"/>

  <!-- Candlestick 2: Red -->
  <line x1="240" y1="180" x2="240" y2="330" stroke="#f87171" stroke-width="12" stroke-linecap="round"/>
  <rect x="220" y="210" width="40" height="90" rx="8" fill="#ef4444"/>

  <!-- Candlestick 3: Cyan Breakout -->
  <line x1="340" y1="110" x2="340" y2="280" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <rect x="320" y="140" width="40" height="110" rx="8" fill="#0ea5e9"/>

  <!-- Trend Line Glow and Foreground -->
  <path d="M 80 360 Q 200 300, 290 230 T 420 120" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round" opacity="0.4"/>
  <path d="M 80 360 Q 200 300, 290 230 T 420 120" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round"/>
  <circle cx="420" cy="120" r="16" fill="#ffffff" stroke="#3b82f6" stroke-width="6"/>
</svg>
